version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend/node_modules:/usr/src/app/node_modules
    environment:
      - MONGO_URI=mongodb://mongo:27017/todo_db
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    volumes:
      - ./frontend/node_modules:/usr/src/app/node_modules
      - ./frontend/dist:/usr/src/app/dist
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

volumes:
  mongo_data:
